global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "aws-api"
    static_configs:
      - targets: ["3.35.151.233:8080"]
        labels:
          type: "app"
      - targets: ["3.35.151.233:9100"]
        labels:
          type: "node"

  - job_name: "aws-monitor"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "gcp-mongodb"
    static_configs:
      - targets: ["34.47.80.98:9216"]
        labels:
          type: "mongodb"
      - targets: ["34.47.80.98:9100"]
        labels:
          type: "node"

  - job_name: "gcp-airflow"
    static_configs:
      - targets: ["34.47.107.145:9100"]
