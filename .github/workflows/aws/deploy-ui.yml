name: Deploy UI

on:
  push:
    branches: [main]
    paths:
      - 'services/ui/**'
  repository_dispatch:
    types: [deploy-ui]
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/ui/package-lock.json

      - name: Install dependencies
        working-directory: services/ui
        run: npm ci

      - name: Build
        working-directory: services/ui
        env:
          VITE_API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3 (hashed assets)
        run: |
          aws s3 sync services/ui/dist/ s3://${{ secrets.UI_S3_BUCKET }}/ \
            --delete \
            --exclude "index.html" \
            --exclude "*.json" \
            --cache-control "max-age=31536000, immutable"

      - name: Sync to S3 (index.html + manifests)
        run: |
          aws s3 cp services/ui/dist/index.html s3://${{ secrets.UI_S3_BUCKET }}/index.html \
            --cache-control "no-cache, must-revalidate"
          aws s3 sync services/ui/dist/ s3://${{ secrets.UI_S3_BUCKET }}/ \
            --exclude "*" \
            --include "*.json" \
            --cache-control "no-cache, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
